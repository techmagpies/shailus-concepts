<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customized Orders | Thambulaa Return Gifts</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../customized.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div id="header"></div>

<section class="page-banner">

<div class="container">

<h1>Customized Orders</h1>

<p>Create your personalized gift exactly the way you want.</p>

</div>

</section>


<section class="custom-order">

<div class="container">

<div class="order-card">

<h2>Customization Request Form</h2>

<form id="customOrderForm">

<div class="form-grid">

<div class="form-group">

<label>Full Name *</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required>

</div>

<div class="form-group">

<label>Mobile Number *</label>

<input
type="tel"
id="phone"
placeholder="9876543210"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="example@gmail.com">

</div>

<div class="form-group">

<label>Select Product *</label>

<select id="product" required>

<option value="">Choose Product</option>

</select>

</div>

<div class="form-group">

<label>Occasion *</label>

<select id="occasion">

<option>Wedding</option>

<option>Birthday</option>

<option>Baby Shower</option>

<option>House Warming</option>

<option>Festival</option>

<option>Corporate</option>

<option>Anniversary</option>

<option>Other</option>

</select>

</div>

<div class="form-group">

<label>Required Quantity *</label>

<input
type="number"
id="quantity"
min="1"
placeholder="10"
required>

</div>

<div class="form-group">

<label>Required Delivery Date *</label>

<input
type="date"
id="date"
required>

</div>

<div class="form-group">

<label>Reference Image</label>

<input
type="file"
id="reference">

</div>

</div>

<div class="form-group">

<label>Customization Details *</label>

<textarea
id="details"
rows="6"
placeholder="Mention names, colors, photos, quotes, theme, size, etc."
required></textarea>

</div>

<div class="form-group">

<label>Delivery Address</label>

<textarea
id="address"
rows="4"
placeholder="Enter complete address"></textarea>

</div>

<button
type="submit"
class="primary-btn">

<i class="fa-brands fa-whatsapp"></i>

Send Request

</button>

</form>

</div>

</div>

</section>

<div id="footer"></div>



<script src="../js/products-data.js"></script>

<script src="../js/customized.js"></script>

</body>

</html>
