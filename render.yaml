databases:
  - name: shailus-concepts-orders-staging
    databaseName: shailus_concepts
    user: shailus_concepts
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: shailus-concepts-api-staging
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: shailus-concepts-orders-staging
          property: connectionString
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_USERS_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_ALLOWED_ORIGINS
        sync: false
