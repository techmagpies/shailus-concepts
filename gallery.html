<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Gallery | Shailu's Concepts</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="shared-navbar.css">
    <link rel="stylesheet" href="shared-footer.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div id="shared-navbar-mount"></div>
<script src="shared-navbar.js"></script>

<main class="gallery-section">
    <div class="container">
        <h1 class="gallery-heading" id="galleryCategoryTitle">All Products</h1>
        <input type="hidden" id="gallerySearchInput" aria-label="Navbar product search">
        <p class="gallery-status" id="galleryStatus" role="status" aria-live="polite"></p>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</main>

<div id="footer"></div>

<!-- ================= SCRIPTS ================= -->
<script src="products-data.js" defer></script>
<script src="cart-store.js" defer></script>
<script src="gallery.js" defer></script>

<script src="shared-footer.js"></script>
</body>

</html>
